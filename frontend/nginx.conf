server {
    # 8080, не 80 — базовый образ nginxinc/nginx-unprivileged не root
    # (см. frontend/Dockerfile), непривилегированному процессу порт <1024
    # недоступен. Наружу это не видно: контейнер не публикует порт на хост,
    # к нему обращается только proxy по внутренней docker-сети
    # (frontend:8080 в deploy/nginx/*.conf.template).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Без явного Cache-Control nginx не шлёт заголовок вовсе, и браузер
    # (особенно мобильный Safari) кэширует index.html/sw.js по эвристике
    # на основе Last-Modified — иногда на сутки и больше. Пока это не
    # истекло, вкладка не видит новый деплой вообще: она даже не обращается
    # к серверу, чтобы обнаружить новый service worker, а обычная
    # перезагрузка страницы не помогает (см. src/main.tsx — авто-обновление
    # SW работает, только если браузер вообще заметил новую версию).
    # no-cache = не "не кэшировать", а "всегда сверяться с сервером" —
    # дешёвый 304 при каждой загрузке вместо многочасовой слепоты к деплоям.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }
}
