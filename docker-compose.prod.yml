name: jirajura

# Продакшн-стек JiraJura. Полностью изолирован от других приложений на
# сервере: свой compose-project ("jirajura" выше), свои volumes/сеть, порты
# наружу только у proxy — 80/443 на выделенном production-сервере
# (см. deploy/README.md). Запуск: docker compose -f docker-compose.prod.yml up -d
# (переменные читаются из .env рядом с этим файлом — см. .env.example).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sao_inspection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/sao_inspection
      SECRET_KEY: ${SECRET_KEY}
      # Keep both spellings: browsers omit the default :443 port from Origin,
      # while a non-standard HTTPS_PORT is included in Origin.
      CORS_ORIGINS: https://${DOMAIN},https://${DOMAIN}:${HTTPS_PORT:-443}
      # Аварийный рубильник "одна проверка площадки в сутки" — см. app/config.py.
      # По умолчанию выключен, т.к. блокировал повторные обходы в поле (409).
      ENABLE_DAILY_INSPECTION_LIMIT: ${ENABLE_DAILY_INSPECTION_LIMIT:-false}
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    mem_limit: 512m

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    mem_limit: 128m

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # active.conf.template переключается между http-only.conf.template и
      # proxy.conf.template скриптами в deploy/scripts/ — см. deploy/README.md
      - ./deploy/nginx/active.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    environment:
      DOMAIN: ${DOMAIN}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./deploy/certbot/www:/var/www/certbot
      - ./deploy/certbot/conf:/etc/letsencrypt
    entrypoint: "true"  # инертен по умолчанию — вызывается вручную из deploy/scripts/*.sh

volumes:
  pgdata:
