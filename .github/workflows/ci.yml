name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate ODH proxy configuration
        run: bash deploy/tests/test_odh_proxy_config.sh

      - name: Validate photo-service proxy configuration
        run: bash deploy/tests/test_sao_photo_proxy_config.sh

      - name: Validate «Люки САО» proxy configuration
        run: bash deploy/tests/test_luki_proxy_config.sh

      - name: Validate deployment scripts
        run: bash -n deploy/scripts/deploy-watcher.sh deploy/scripts/verify-odh-proxy.sh deploy/scripts/enable-luki-sao.sh

      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.prod.yml config >/dev/null

      - name: Render and validate nginx configuration
        run: |
          cp deploy/nginx/http-only.conf.template deploy/nginx/active.conf.template
          trap 'rm -f deploy/nginx/active.conf.template' EXIT
          docker run --rm \
            -e DOMAIN=example.test \
            -e HTTPS_PORT=443 \
            -v "$PWD/deploy/nginx/active.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/deploy/nginx/odh-api.conf:/etc/nginx/odh-api.conf:ro" \
            -v "$PWD/deploy/nginx/sao-photo-location.conf:/etc/nginx/sao-photo-location.conf:ro" \
            -v "$PWD/deploy/nginx/sites:/etc/nginx/sites:ro" \
            -v "$PWD/deploy/nginx/sites-enabled:/etc/nginx/sites-enabled:ro" \
            nginx:1.30-alpine nginx -t

      # Полный TLS-конфиг с включённым сайтом «Люки САО» — на временных
      # самоподписанных сертификатах: http-only выше не содержит include
      # sites-enabled, а ошибка в luki-sao.conf иначе всплыла бы только на
      # сервере, в enable-luki-sao.sh.
      - name: Render and validate TLS nginx configuration with sites enabled
        run: |
          certs="$(mktemp -d)"
          cp deploy/nginx/proxy.conf.template deploy/nginx/active.conf.template
          ln -sfn ../sites/luki-sao.conf deploy/nginx/sites-enabled/luki-sao.conf
          trap 'rm -f deploy/nginx/active.conf.template deploy/nginx/sites-enabled/luki-sao.conf; rm -rf "$certs"' EXIT
          for domain in example.test luki.obhod-sao.ru; do
            mkdir -p "$certs/live/$domain"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=$domain" \
              -keyout "$certs/live/$domain/privkey.pem" -out "$certs/live/$domain/fullchain.pem" 2>/dev/null
          done
          docker run --rm \
            -e DOMAIN=example.test \
            -e HTTPS_PORT=443 \
            -v "$PWD/deploy/nginx/active.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$PWD/deploy/nginx/odh-api.conf:/etc/nginx/odh-api.conf:ro" \
            -v "$PWD/deploy/nginx/sao-photo-location.conf:/etc/nginx/sao-photo-location.conf:ro" \
            -v "$PWD/deploy/nginx/sites:/etc/nginx/sites:ro" \
            -v "$PWD/deploy/nginx/sites-enabled:/etc/nginx/sites-enabled:ro" \
            -v "$certs:/etc/letsencrypt:ro" \
            nginx:1.30-alpine nginx -t

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/jirajura_test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
