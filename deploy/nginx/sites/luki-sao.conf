# «Люки САО» (Hainox/luki-sao) — отдельный compose-проект на этом же
# сервере: его web-контейнер входит в сеть jirajura_default под именем
# luki-web и не публикует портов, снаружи он доступен только через этот
# proxy. Включается скриптом deploy/scripts/enable-luki-sao.sh (симлинк в
# deploy/nginx/sites-enabled/) только после выпуска сертификата: без
# файлов сертификата nginx -t не проходит, и proxy журнала обходов не
# поднялся бы вовсе.
server {
    listen 443 ssl;
    server_name luki.obhod-sao.ru;

    ssl_certificate     /etc/letsencrypt/live/luki.obhod-sao.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luki.obhod-sao.ru/privkey.pem;

    # Синхронно с MAX_PHOTO_SIZE_MB «Люков САО» (20 МБ) + запас на заголовки.
    client_max_body_size 25m;

    # Резолв luki-web на каждый запрос, как у api/frontend журнала обходов:
    # после пересборки контейнера его IP меняется. Пока «Люки САО» не
    # запущены, этот сайт отвечает 502, а остальной proxy работает.
    resolver 127.0.0.11 valid=10s;

    location / {
        set $luki_upstream luki-web:8080;
        proxy_pass http://$luki_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # По X-Real-IP журнал обходов ограничивает попытки входа, а
        # «Люки САО» проверяют пароль через него — адрес клиента должен
        # дойти до конца цепочки.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
