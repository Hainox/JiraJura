# Include inside the existing TLS server for obhod-sao.ru.
# The proxy container is attached to sao-photo-service-edge only for this
# upstream; the new PostgreSQL and media services stay on private networks.
location /photo-api/ {
    set $sao_photo_upstream sao-photo-service-api:8788;
    rewrite ^/photo-api/(.*)$ /$1 break;
    proxy_pass http://$sao_photo_upstream$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /photo-api;
    proxy_read_timeout 120s;
}
